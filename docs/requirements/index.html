<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>货代获客工具需求 V0</title><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><style>:root{--nav:300px;--bg:#f6f8fb;--panel:#fff;--text:#1f2937;--muted:#64748b;--line:#e5e7eb;--blue:#2563eb}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.72}aside{position:fixed;left:0;top:0;bottom:0;width:var(--nav);background:#0f172a;color:#cbd5e1;overflow:auto;padding:22px 16px}aside h1{font-size:18px;color:white;margin:0 0 16px;padding:0 6px 14px;border-bottom:1px solid #334155}.search{position:sticky;top:0;background:#0f172a;padding-bottom:12px}.search input{width:100%;padding:9px 10px;border:1px solid #475569;background:#111827;color:#fff;border-radius:8px;outline:none}.search small{display:block;margin-top:6px;color:#94a3b8}nav a{display:block;color:#cbd5e1;text-decoration:none;padding:6px 8px;border-radius:7px;font-size:13px}nav a:hover,nav a.active{background:#1e293b;color:white}main{margin-left:var(--nav);max-width:1180px;padding:34px 50px 80px}header{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:white;border-radius:16px;padding:34px;margin-bottom:24px}header h2{margin:0 0 8px;font-size:32px}header p{margin:0;color:#dbeafe}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 30px;margin:20px 0;box-shadow:0 4px 14px rgba(15,23,42,.04)}h1,h2,h3,h4{line-height:1.35;scroll-margin-top:18px}h2{font-size:25px;border-bottom:1px solid var(--line);padding-bottom:10px}h3{font-size:19px;margin-top:26px}blockquote{margin:18px 0;padding:12px 16px;background:#eff6ff;border-left:4px solid #3b82f6;border-radius:6px;color:#334155}table{width:100%;border-collapse:collapse;margin:16px 0 24px;display:block;overflow:auto;font-size:14px}th,td{border:1px solid var(--line);padding:10px 12px;vertical-align:top;min-width:120px}th{background:#f8fafc}tr:nth-child(even) td{background:#fcfdff}code{background:#eef2f7;padding:2px 6px;border-radius:5px}pre{background:#0f172a;color:#e2e8f0;padding:16px;border-radius:10px;overflow:auto}pre code{background:transparent;padding:0}mark{background:#fde68a}#loading{padding:80px;text-align:center;color:var(--muted)}.top{position:fixed;right:22px;bottom:22px;border:0;border-radius:999px;background:var(--blue);color:white;width:44px;height:44px;cursor:pointer;box-shadow:0 6px 18px rgba(37,99,235,.35)}@media(max-width:900px){aside{position:relative;width:auto;max-height:360px}main{margin-left:0;padding:18px}header{border-radius:10px;padding:24px}.card{padding:20px}}</style></head><body><aside><h1>货代获客工具需求 V0</h1><div class="search"><input id="q" placeholder="搜索需求、模块、规则…"><small id="count">加载完成后可搜索</small></div><nav id="toc"></nav></aside><main><header><h2>货代获客工具需求 V0</h2><p>根据现有代码反推 · 忠实还原实现 · 可点击需求文档</p></header><div id="loading">正在加载需求文档…</div><article id="content"></article></main><button class="top" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button><script>const base='https://raw.githubusercontent.com/caijunzhen618-beep/tradebusiness/main/docs/requirements/';const parts=['requirements-v0-part-1.md','requirements-v0-part-2.md','requirements-v0-part-3.md','requirements-v0-part-4.md'].map(p=>base+p);const content=document.querySelector('#content'),toc=document.querySelector('#toc'),q=document.querySelector('#q'),count=document.querySelector('#count');function slug(s,i){return 'sec-'+i+'-'+s.replace(/[^\w\u4e00-\u9fff]+/g,'-').replace(/^-|-$/g,'').slice(0,50)}async function load(){try{const texts=await Promise.all(parts.map(p=>fetch(p).then(r=>{if(!r.ok)throw Error(p);return r.text()})));content.innerHTML=marked.parse(texts.join('\n\n'),{gfm:true});document.querySelector('#loading').remove();buildToc();wrapSections();count.textContent='全文已加载';}catch(e){document.querySelector('#loading').textContent='加载失败：请检查网络或 Raw GitHub 访问。';}}function buildToc(){const hs=[...content.querySelectorAll('h2,h3')];hs.forEach((h,i)=>h.id=slug(h.textContent,i));toc.innerHTML=hs.map(h=>`<a data-level="${h.tagName}" href="#${h.id}" style="padding-left:${h.tagName==='H3'?22:8}px">${h.textContent}</a>`).join('');const links=[...toc.querySelectorAll('a')];const io=new IntersectionObserver(es=>es.filter(e=>e.isIntersecting).forEach(e=>links.forEach(a=>a.classList.toggle('active',a.hash==='#'+e.target.id))),{rootMargin:'-20% 0px -70% 0px'});hs.forEach(h=>io.observe(h));}function wrapSections(){[...content.querySelectorAll('h2')].forEach(h=>{const box=document.createElement('section');box.className='card';h.parentNode.insertBefore(box,h);let n=h;while(n&&!(n!==h&&n.tagName==='H2')){const next=n.nextSibling;box.appendChild(n);n=next;}})}function clearMarks(){document.querySelectorAll('mark[data-s]').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)))}function search(){clearMarks();const term=q.value.trim();if(!term){count.textContent='全文已加载';return}const nodes=[];const w=document.createTreeWalker(content,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&!['SCRIPT','STYLE','MARK'].includes(n.parentElement.tagName)&&n.nodeValue.toLowerCase().includes(term.toLowerCase())?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});while(w.nextNode())nodes.push(w.currentNode);let hits=0,first=null;nodes.forEach(n=>{const t=n.nodeValue,l=t.toLowerCase(),s=term.toLowerCase();let pos=0,f=document.createDocumentFragment(),found=false;for(;;){const at=l.indexOf(s,pos);if(at<0){f.append(t.slice(pos));break}f.append(t.slice(pos,at));const m=document.createElement('mark');m.dataset.s='1';m.textContent=t.slice(at,at+term.length);f.append(m);if(!first)first=m;hits++;found=true;pos=at+term.length}if(found)n.parentNode.replaceChild(f,n)});count.textContent=`${hits} 处匹配`;if(first)first.scrollIntoView({behavior:'smooth',block:'center'})}q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});q.addEventListener('input',()=>{if(!q.value)search()});load();</script></body></html>
