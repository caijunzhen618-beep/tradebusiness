# TradeBusiness production deployment by IP
# Server IP: 8.145.59.67
#
# URLs:
#   Admin:  http://8.145.59.67/admin/
#   Client: http://8.145.59.67/client/
#   API:    http://8.145.59.67/api/
#   WS:     ws://8.145.59.67/api/v1/notifications/ws/<user_id>

upstream tradebusiness_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 8.145.59.67;

    client_max_body_size 20m;

    # Redirect the root URL to the admin console.
    location = / {
        return 302 /admin/;
    }

    # Management frontend.
    # Build the admin frontend with Vite base: /admin/
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /root/workspace/tradebusiness/tradebusiness-admin/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Client frontend.
    # Build the client frontend with Vite base: /client/
    location = /client {
        return 301 /client/;
    }

    location /client/ {
        alias /root/workspace/tradebusiness/tradebusiness-client/dist/;
        index index.html;
        try_files $uri $uri/ /client/index.html;
    }

    # FastAPI HTTP API.
    location /api/ {
        proxy_pass http://tradebusiness_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # FastAPI WebSocket notifications.
    location /api/v1/notifications/ws/ {
        proxy_pass http://tradebusiness_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Uploaded files served by FastAPI.
    location /uploads/ {
        proxy_pass http://tradebusiness_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
